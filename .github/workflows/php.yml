name: PHP

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  php-quality:
    name: PHP quality and unit tests
    runs-on: ubuntu-24.04

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, fileinfo, mbstring, xmlwriter
          tools: composer:v2
          coverage: none

      - name: Locate Composer download cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php82-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate Composer metadata
        run: composer validate --no-check-publish

      - name: Lint PHP syntax
        run: composer lint:syntax

      - name: Run PHPStan
        run: composer stan

      - name: Run unit tests
        run: composer test
